<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
        content="Operational malaria early-warning dashboard for Cameroon health districts.">
  <meta name="color-scheme" content="light">
  <title>Malaria Early-Warning System</title>

  <!--
    API base URL.

    Served by serve_all.py the dashboard and the API share an origin, so the
    same-origin default is correct and nothing needs setting. Served separately
    (python -m http.server 5173) they do not, and the API is conventionally on
    8000 of the same host — detected here so both layouts work untouched.
    Override explicitly for any other deployment.
  -->
  <script>
    globalThis.__MEWS_API_BASE__ =
      (location.port && location.port !== '8000')
        ? `${location.protocol}//${location.hostname}:8000/api/v1`
        : `${location.origin}/api/v1`;
  </script>

  <!--
    Leaflet, vendored locally. It used to load from a CDN, which made the map
    depend on the network and on that CDN staying reachable; the dashboard has to
    work on a machine with no internet, so the library ships with the app.
    Cameroon's boundaries ship too (src/data/), giving a real basemap offline.
  -->
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css">
  <script defer src="./vendor/leaflet/leaflet.js"></script>

  <link rel="stylesheet" href="./styles/tokens.css">
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/layout.css">
  <link rel="stylesheet" href="./styles/components.css">
</head>
<body>
  <!-- Blocks the UI until the API and district catalogue are confirmed available. -->
  <div class="boot" id="boot">
    <div class="boot__card">
      <span class="spinner" aria-hidden="true"></span>
      <p class="boot__msg">Connecting to the prediction service…</p>
    </div>
  </div>

  <!--
    Opening this file directly (file://) cannot work: browsers treat every file://
    document as a unique opaque origin and refuse to load ES modules from it, so
    src/main.js is blocked before it ever runs. Detect that here and explain it,
    otherwise the page just sits on the spinner with only a console error.
  -->
  <script>
    if (window.location.protocol === 'file:') {
      document.getElementById('boot').innerHTML =
        '<div class="boot__card">' +
        '<h1 class="boot__title">Serve this over HTTP, not file://</h1>' +
        '<p class="boot__msg">Browsers block JavaScript modules on <code>file://</code> ' +
        'because each file is treated as a separate security origin. ' +
        'The dashboard needs a local web server — any will do.</p>' +
        '<pre class="boot__detail">cd webapp/frontend\npython -m http.server 5173</pre>' +
        '<p class="boot__hint">Then open <strong>http://localhost:5173</strong><br>' +
        'Or serve the API and dashboard together on one origin:<br>' +
        '<code>cd webapp &amp;&amp; python serve_all.py</code></p>' +
        '</div>';
    }
  </script>

  <div class="app">
    <header class="app__header">
      <h1 class="app__title">Malaria Early-Warning System</h1>
      <p class="app__subtitle">Cameroon health districts · climate-driven risk</p>
      <span class="app__badge">Two-stage recursive chain</span>
    </header>

    <main class="app__main">
      <div class="app__toolbar" id="toolbar"></div>
      <div class="app__map-wrap">
        <div class="app__map" id="map" role="region" aria-label="District risk map"></div>
        <!-- Legend overlays the map only, so it never covers the district strip. -->
        <div id="legend"></div>
      </div>
      <div class="app__districts" id="district-list"></div>
    </main>

    <aside class="app__panel" id="panel" aria-live="polite"></aside>
  </div>

  <div id="toasts"></div>

  <!--
    Native ES modules — no build step. `defer` on the Leaflet tag above guarantees
    it has executed before this module runs.
  -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
