# Production serving for the dashboard.
#
# Serves the static files and proxies /api to the FastAPI backend, so the browser
# sees a single origin. That removes the CORS surface entirely — the API's
# permissive allow_origins="*" can be tightened or dropped in production.

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Security headers.
    #
    # Leaflet and Cameroon's boundaries are vendored, so no external origin is
    # needed for script or style any more. Basemap raster tiles remain the one
    # outward request; drop that img-src entry too if you self-host tiles or
    # accept the vector-only basemap (the dashboard degrades to it by design).
    # Must match MAP.tileUrl in src/config.js -- a mismatch silently blocks every
    # tile, which looks exactly like a provider outage.
    add_header X-Content-Type-Options "nosniff"            always;
    add_header X-Frame-Options        "DENY"               always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src  'self'; \
         style-src   'self' 'unsafe-inline'; \
         img-src     'self' data: https://server.arcgisonline.com; \
         connect-src 'self'; \
         font-src    'self'; \
         base-uri    'self'; \
         frame-ancestors 'none'" always;

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # Hashed assets could be cached hard; without a build step we revalidate.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # API passthrough — keeps the browser on one origin.
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Model inference is CPU-bound; allow a slow first response.
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # Single page: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
